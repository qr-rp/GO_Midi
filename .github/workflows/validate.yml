name: Validate

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev
  workflow_dispatch:

permissions:
  contents: read

env:
  WX_VERSION: "3.3.1"

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup MSVC
      uses: ilammy/msvc-dev-cmd@v1

    - name: Get CPU count
      id: cpu
      shell: pwsh
      run: echo "count=$((Get-CimInstance Win32_ComputerSystem).NumberOfLogicalProcessors)" >> $env:GITHUB_OUTPUT

    - name: Cache wxWidgets source
      id: cache-wx
      uses: actions/cache@v4
      with:
        path: wxWidgets-3.3.1
        key: wxwidgets-source-${{ env.WX_VERSION }}

    - name: Download and extract wxWidgets
      if: steps.cache-wx.outputs.cache-hit != 'true'
      shell: pwsh
      run: |
        Invoke-WebRequest -Uri "https://github.com/wxWidgets/wxWidgets/releases/download/v${{ env.WX_VERSION }}/wxWidgets-${{ env.WX_VERSION }}.tar.bz2" -OutFile "wxWidgets.tar.bz2"
        7z x "wxWidgets.tar.bz2" -y
        7z x "wxWidgets.tar" -y
        Remove-Item "wxWidgets.tar.bz2", "wxWidgets.tar" -ErrorAction SilentlyContinue

    - name: Configure
      shell: pwsh
      run: cmake --preset windows-ninja

    - name: Build and validate
      shell: pwsh
      run: cmake --build --preset windows-ninja --target validate -j ${{ steps.cpu.outputs.count }}
